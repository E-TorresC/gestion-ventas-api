# ========================================
# CONFIGURACIÓN SQL SERVER - DESARROLLO
# ========================================

# Driver y conexión
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=gestion_ventas_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=2026@app!

# ========================================
# JPA / HIBERNATE
# ========================================

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ========================================
# LOGGING
# ========================================

logging.level.etctech.gestionventas=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE